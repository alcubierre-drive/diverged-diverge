<a name="Topic295"></a><div class="CTopic TClass LTextFile first">
 <div class="CTitle">Compilation-MPI</div>
 <div class="CBody"><div class="CHeading">Enabling MPI (multi-node parallelism)</div><p>in your 'Makefile.local', put</p><pre class="CCode">USE_MPI := <span class="SHKeyword">true</span><br />CC := mpicc<br />CXX := mpicxx<br />LD := mpicxx</pre><p>You might need to set other names for the compilers. Note how defining the 'make' variable 'USE_MPI' switches behavior of the Makefile.</p></div>
</div>
